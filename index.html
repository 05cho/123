<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위도와 기후 학습기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f1f5f9;
            font-family: 'Nanum Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* 폰트 스타일 */
        h1, h2, h3, .jua-font {
            font-family: 'Jua', sans-serif;
            font-weight: 400;
            color: #1e293b;
        }

        /* 헤더 (제목 영역) */
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            font-size: 54px;
            color: #4338ca;
            margin-bottom: 10px;
        }
        header p {
            font-size: 24px;
            color: #64748b;
            font-weight: bold;
        }

        /* 메인 콘텐츠 영역 (가로 배치) */
        main {
            display: flex;
            flex-direction: row;
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 1200px;
            padding: 50px;
            gap: 60px;
            align-items: center;
            flex-wrap: wrap; /* 화면이 작아지면 세로로 떨어지도록 */
        }

        /* 왼쪽: 지구 영역 */
        .earth-column {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 450px;
        }

        .earth-container {
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 6px solid #334155;
            background-color: #e2e8f0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            cursor: ns-resize; /* 상하 드래그 커서 */
            user-select: none;
            touch-action: none; /* 모바일 터치 스크롤 방지 */
        }

        /* 지구 배경 기후대 (위에서부터) */
        .earth-zone { position: absolute; width: 100%; left: 0; }
        .zone-high-n { top: 0; height: 16.66%; background-color: #dce9f4; }
        .zone-mid-n { top: 16.66%; height: 16.67%; background-color: #eef2d8; }
        .zone-low { top: 33.33%; height: 33.34%; background-color: #fce5e6; }
        .zone-mid-s { top: 66.67%; height: 16.66%; background-color: #eef2d8; }
        .zone-high-s { top: 83.33%; height: 16.67%; background-color: #dce9f4; }

        /* 위도 선 */
        .lat-line {
            position: absolute;
            left: 0;
            width: 100%;
            border-top: 2px dashed rgba(51, 65, 85, 0.4);
            pointer-events: none;
        }
        .line-60n { top: 16.66%; }
        .line-30n { top: 33.33%; }
        .line-0 { top: 50%; border-top: 3px solid #e11d48; } /* 적도선 강조 */
        .line-30s { top: 66.67%; }
        .line-60s { top: 83.33%; }

        /* 위도 텍스트 라벨 (고정) */
        .lat-label {
            position: absolute;
            right: 15px;
            transform: translateY(-50%);
            font-size: 16px;
            font-weight: 700;
            color: #475569;
            pointer-events: none;
            background-color: rgba(255,255,255,0.7);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .lbl-60n { top: 16.66%; }
        .lbl-30n { top: 33.33%; }
        .lbl-0 { top: 50%; color: #e11d48; font-size: 20px; right: 10px; }
        .lbl-30s { top: 66.67%; }
        .lbl-60s { top: 83.33%; }

        /* 북위, 적도, 남위 뱃지 */
        .badge-container {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
        }
        .badge-n { background-color: #ef4444; color: white; padding: 6px 20px; border-radius: 20px; font-size: 20px; font-weight: bold; margin-bottom: 50px; }
        .badge-eq { background-color: #f97316; color: white; padding: 10px 30px; border-radius: 12px; font-size: 24px; font-weight: bold; border: 3px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .badge-s { background-color: #ef4444; color: white; padding: 6px 20px; border-radius: 20px; font-size: 20px; font-weight: bold; margin-top: 50px; }
        .arrow-up { position: absolute; top: 35%; color: #ef4444; font-size: 30px; font-weight: bold; }
        .arrow-down { position: absolute; bottom: 35%; color: #ef4444; font-size: 30px; font-weight: bold; }

        /* 드래그 가능한 조절 바 */
        #slider-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #3b82f6;
            top: 50%; /* 초기위치 */
            transform: translateY(-50%);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);
            z-index: 10;
            pointer-events: none;
        }
        #slider-handle {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 40px;
            background-color: #3b82f6;
            border-radius: 20px;
            border: 3px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            transition: transform 0.1s;
        }
        .earth-container:active #slider-handle {
            transform: translate(-50%, -50%) scale(1.1);
            background-color: #2563eb;
        }

        /* 오른쪽: 설명 영역 */
        .info-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 400px;
        }

        .instruction-box {
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .instruction-box i { font-size: 30px; color: #3b82f6; }
        .instruction-box p { font-size: 20px; font-weight: bold; color: #475569; }

        /* 위도 입력 폼 스타일 */
        .input-box {
            background-color: #e0e7ff;
            border: 2px solid #a5b4fc;
            border-radius: 16px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #4338ca;
        }
        .input-box input {
            font-size: 24px;
            font-weight: bold;
            width: 90px;
            text-align: center;
            padding: 5px;
            border: 2px solid #6366f1;
            border-radius: 8px;
            outline: none;
            font-family: 'Jua', sans-serif;
            color: #1e293b;
        }
        .input-box input:focus {
            border-color: #4338ca;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        /* 북위/남위 선택 드롭다운 스타일 */
        .dir-select {
            font-size: 20px;
            font-weight: bold;
            padding: 5px;
            border: 2px solid #6366f1;
            border-radius: 8px;
            outline: none;
            font-family: 'Jua', sans-serif;
            color: #1e293b;
            cursor: pointer;
            background-color: white;
        }
        .dir-select:focus {
            border-color: #4338ca;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        /* 동적 기후 정보 카드 */
        #dynamic-card {
            background-color: #fce5e6;
            border: 4px solid #fca5a5;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.05);
            transition: background-color 0.3s ease, border-color 0.3s ease; 
            min-height: 280px; /* 불필요한 내용 삭제로 높이 축소 및 단단하게 고정 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .lat-display-title { font-size: 24px; color: #64748b; margin-bottom: 15px; font-weight: bold; }
        #lat-value { font-size: 70px; color: #1e293b; line-height: 1; margin-bottom: 30px; letter-spacing: -2px; }

        .climate-badge {
            display: inline-block;
            background-color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 32px;
            color: #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

    </style>
</head>
<body>

    <header>
        <h1 class="jua-font">지구의 위도와 기후 🌍</h1>
        <p class="jua-font">적도, 북위, 남위는 어떻게 다를까요?</p>
    </header>

    <main>
        <!-- 왼쪽: 지구 모형 (조작부) -->
        <div class="earth-column">
            <div class="earth-container" id="earth-box">
                <!-- 1. 기후대 배경색 -->
                <div class="earth-zone zone-high-n"></div>
                <div class="earth-zone zone-mid-n"></div>
                <div class="earth-zone zone-low"></div>
                <div class="earth-zone zone-mid-s"></div>
                <div class="earth-zone zone-high-s"></div>

                <!-- 2. 위도 구분선 및 라벨 -->
                <div class="lat-line line-60n"></div>
                <div class="lat-line line-30n"></div>
                <div class="lat-line line-0"></div>
                <div class="lat-line line-30s"></div>
                <div class="lat-line line-60s"></div>

                <div class="lat-label lbl-60n">60°</div>
                <div class="lat-label lbl-30n">30°</div>
                <div class="lat-label lbl-0">0°</div>
                <div class="lat-label lbl-30s">30°</div>
                <div class="lat-label lbl-60s">60°</div>

                <!-- 3. 고정 뱃지 (북위, 적도, 남위) -->
                <div class="badge-container">
                    <div class="badge-n jua-font">북위</div>
                    <div class="arrow-up">⬆</div>
                    <div class="badge-eq jua-font">적도</div>
                    <div class="arrow-down">⬇</div>
                    <div class="badge-s jua-font">남위</div>
                </div>

                <!-- 4. 마우스로 움직이는 조절 바 -->
                <div id="slider-bar">
                    <div id="slider-handle">
                        <i class="fa-solid fa-sort"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 정보 출력부 -->
        <div class="info-column">
            <div class="instruction-box">
                <i class="fa-solid fa-computer-mouse"></i>
                <p>왼쪽 지구 위에서 마우스나 키보드(↑, ↓)로 바를 움직여 보세요!</p>
            </div>

            <!-- 숫자 입력 폼 -->
            <div class="input-box jua-font">
                <label>위도 직접 입력 :</label>
                <select id="lat-dir" class="dir-select">
                    <option value="N">북위</option>
                    <option value="S">남위</option>
                </select>
                <input type="number" id="lat-input" min="0" max="90" placeholder="0" value="0">
                <span>도</span>
            </div>

            <!-- 위도에 따라 내용이 바뀌는 카드 -->
            <div id="dynamic-card">
                <div class="lat-display-title">현재 설정된 위치</div>
                <h2 id="lat-value" class="jua-font">적도 0°</h2>

                <div id="climate-zone" class="climate-badge jua-font">저위도</div>
            </div>
        </div>
    </main>

    <!-- 기능 구현 자바스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const earthBox = document.getElementById("earth-box");
            const sliderBar = document.getElementById("slider-bar");
            const latInput = document.getElementById("lat-input");
            const latDir = document.getElementById("lat-dir"); // 추가된 드롭다운
            
            // 텍스트 업데이트 대상 DOM
            const latValueText = document.getElementById("lat-value");
            const dynamicCard = document.getElementById("dynamic-card");
            const climateZoneText = document.getElementById("climate-zone");

            let isDragging = false;
            let currentLatitude = 0; // 현재 위도 저장 변수 (-90 ~ 90)

            // 위도 값에 따라 UI 업데이트 및 바 이동
            function setLatitude(lat) {
                // 범위 제한 (-90 ~ 90)
                lat = Math.max(-90, Math.min(90, lat));
                currentLatitude = lat;

                // 1. 슬라이더 바 위치 이동 (90도 = 0px, 0도 = 250px, -90도 = 500px)
                const rect = earthBox.getBoundingClientRect();
                const height = rect.height || 500;
                const ratio = (90 - lat) / 180;
                const y = ratio * height;
                sliderBar.style.top = `${y}px`;

                // 2. 입력칸 동기화 (포커스가 없을 때만)
                if (document.activeElement !== latInput && document.activeElement !== latDir) {
                    latInput.value = Math.abs(lat);
                    if (lat > 0) {
                        latDir.value = "N";
                    } else if (lat < 0) {
                        latDir.value = "S";
                    }
                }

                // 3. 위도 텍스트 변경
                if (lat === 0) {
                    latValueText.innerText = "적도 0°";
                    latValueText.style.color = "#ea580c";
                } else if (lat > 0) {
                    latValueText.innerText = `북위 ${lat}°`;
                    latValueText.style.color = "#dc2626";
                } else {
                    latValueText.innerText = `남위 ${Math.abs(lat)}°`;
                    latValueText.style.color = "#2563eb";
                }

                // 4. 위도에 따른 기후 정보 변경 (간소화)
                const absLat = Math.abs(lat);
                
                if (absLat <= 30) {
                    dynamicCard.style.backgroundColor = "#fce5e6";
                    dynamicCard.style.borderColor = "#fca5a5";
                    climateZoneText.innerText = "저위도";
                } else if (absLat <= 60) {
                    dynamicCard.style.backgroundColor = "#eef2d8";
                    dynamicCard.style.borderColor = "#bef264";
                    climateZoneText.innerText = "중위도";
                } else {
                    dynamicCard.style.backgroundColor = "#dce9f4";
                    dynamicCard.style.borderColor = "#93c5fd";
                    climateZoneText.innerText = "고위도";
                }
            }

            // 마우스 Y 좌표를 위도로 변환하여 적용
            function updateLatitudeFromMouse(clientY) {
                const rect = earthBox.getBoundingClientRect();
                let y = clientY - rect.top;
                y = Math.max(0, Math.min(y, rect.height));
                
                const ratio = y / rect.height;
                const lat = Math.round(90 - (ratio * 180));
                setLatitude(lat);
            }

            // 마우스 & 터치 이벤트 리스너 등록
            earthBox.addEventListener("pointerdown", (e) => {
                isDragging = true;
                earthBox.setPointerCapture(e.pointerId);
                updateLatitudeFromMouse(e.clientY);
            });

            earthBox.addEventListener("pointermove", (e) => {
                if (isDragging) {
                    updateLatitudeFromMouse(e.clientY);
                }
            });

            earthBox.addEventListener("pointerup", (e) => {
                isDragging = false;
                earthBox.releasePointerCapture(e.pointerId);
            });

            // 직접 입력 이벤트 (입력칸 & 드롭다운)
            function handleManualInput(e) {
                // 사용자가 입력칸을 다 지웠을 때는(빈칸) 에러가 나지 않도록 임시로 0 처리
                if (latInput.value === "") {
                    if (latDir.value === "S") setLatitude(-0);
                    else setLatitude(0);
                    return;
                }

                let val = parseInt(latInput.value, 10);
                if (isNaN(val)) val = 0;
                
                // 입력값은 무조건 0~90 사이로 제한
                val = Math.max(0, Math.min(90, val));
                
                // 90을 초과하는 숫자를 쳤을 때만 강제로 교정 (입력 중 방해 방지)
                if (parseInt(latInput.value, 10) > 90) {
                    latInput.value = val; 
                }
                
                // 남위가 선택되어 있으면 내부적으로 마이너스 적용
                if (latDir.value === "S") {
                    setLatitude(-val);
                } else {
                    setLatitude(val);
                }
            }

            // 'change' 대신 'input' 이벤트를 사용하여 타이핑 즉시 반응하도록 수정
            latInput.addEventListener("input", handleManualInput);
            latDir.addEventListener("change", handleManualInput);

            // 키보드 방향키 조작
            document.addEventListener("keydown", (e) => {
                // 입력창 텍스트 수정 중일 때는 무시
                if (document.activeElement === latInput && e.key !== 'ArrowUp' && e.key !== 'ArrowDown' && e.key !== 'Enter') {
                    return;
                }

                if (e.key === 'ArrowUp') {
                    setLatitude(currentLatitude + 1);
                    e.preventDefault(); // 기본 스크롤 방지
                } else if (e.key === 'ArrowDown') {
                    setLatitude(currentLatitude - 1);
                    e.preventDefault(); // 기본 스크롤 방지
                }
            });

            // 초기화: 정중앙(적도)
            setLatitude(0); 
        });
    </script>
</body>
</html>
